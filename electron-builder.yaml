# Cascade Electron Builder Configuration
# Build with: npm run electron:build:mac

appId: dev.cascade.app
productName: Cascade
copyright: Copyright © 2025 Cascade

directories:
  output: release
  buildResources: resources

# Files to include in the app
files:
  - dist/**/*
  - electron/**/*.js
  - package.json
  - "!**/*.ts"
  - "!**/*.map"
  - "!**/node_modules/.cache"

extraMetadata:
  main: electron/main.js

# Auto-update via GitHub Releases
publish:
  provider: github
  owner: field-io
  repo: cascade
  releaseType: release

# macOS Configuration
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  # icon: resources/icon.icns  # TODO: Add app icon
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  darkModeSupport: true
  notarize: false

  # File associations
  fileAssociations:
    - ext: cascade
      name: Cascade Graph
      description: Cascade visual programming graph
      # icon: resources/cascade-doc.icns  # TODO: Add document icon
      role: Editor

  # Protocol handler (deep links)
  protocols:
    - name: Cascade
      schemes:
        - cascade

# DMG Configuration
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380
  # background: resources/dmg-background.png  # TODO: Add DMG background

# Windows Configuration
win:
  target:
    - nsis
    - portable
  icon: resources/icon.ico

  fileAssociations:
    - ext: cascade
      name: Cascade Graph
      description: Cascade visual programming graph
      icon: resources/cascade-doc.ico

# NSIS installer (Windows)
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# Linux Configuration
linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  category: Development

  mimeTypes:
    - application/x-cascade

  desktop:
    StartupWMClass: cascade

# AppImage configuration
appImage:
  artifactName: "${productName}-${version}-${arch}.AppImage"

# Build settings
asar: true
compression: maximum
